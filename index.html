<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÖLMEZ ARAÇ KİRALAMA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f6f8f4;
  --paper: rgba(255,255,255,.78);
  --paper-2: rgba(250,252,248,.9);
  --ink: #25332a;
  --muted: #6c7b6e;
  --soft: #e4ecdf;
  --line: rgba(86,113,86,.18);
  --green: #526f4d;
  --green-2: #78946f;
  --nude: #d9c8b6;
  --shadow: 0 24px 70px -44px rgba(50,70,52,.55);
}
body {
  min-height: 100vh;
  font-family: Inter, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 4%, rgba(255,255,255,.92), transparent 30%),
    linear-gradient(135deg, #f7f9f4 0%, #edf3e9 48%, #f4eee8 100%);
  padding: 28px;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.shell { max-width: 1180px; margin: 0 auto; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 24px;
}
.brand { display: flex; align-items: center; gap: 13px; }
.brand-mark {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: linear-gradient(145deg, #ffffff, #eaf2e5);
  border: 1px solid var(--line);
  color: var(--green);
  font-weight: 800;
  box-shadow: var(--shadow);
}
.brand-name { font-size: 23px; font-weight: 700; letter-spacing: .02em; }
.brand-sub {
  margin-top: 3px;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--muted);
  text-transform: uppercase;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 15px;
  background: rgba(255,255,255,.72);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 14px 30px -26px rgba(44,62,48,.45);
}
.btn.primary {
  background: linear-gradient(135deg, rgba(120,148,111,.26), rgba(255,255,255,.72));
  border-color: rgba(82,111,77,.32);
  color: #334a36;
}
.btn.danger { color: #9a504c; background: rgba(178,104,98,.08); }
.btn svg { width: 16px; height: 16px; }
.car-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
  gap: 16px;
}
.car-card {
  min-height: 205px;
  background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(247,250,245,.66));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.12);
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.car-card:hover {
  transform: translateY(-2px);
  border-color: rgba(82,111,77,.34);
  box-shadow: 0 28px 70px -42px rgba(50,70,52,.72);
}
.car-head {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 13px;
  align-items: center;
}
.logo {
  width: 58px; height: 58px;
  border-radius: 16px;
  background: rgba(255,255,255,.72);
  border: 1px solid var(--line);
  padding: 9px;
  display: grid;
  place-items: center;
}
.logo svg { width: 100%; height: 100%; }
.car-title { font-size: 18px; font-weight: 700; line-height: 1.18; }
.plate {
  display: inline-flex;
  margin-top: 8px;
  padding: 5px 10px;
  border-radius: 7px;
  background: #fff;
  border: 1px solid rgba(42,55,45,.16);
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  color: #111;
}
.next-res {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}
.next-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.next-name {
  margin-top: 7px;
  font-size: 15px;
  font-weight: 700;
}
.next-date {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
}
.empty {
  grid-column: 1/-1;
  min-height: 260px;
  display: grid;
  place-items: center;
  border: 1px dashed var(--line);
  border-radius: 18px;
  background: rgba(255,255,255,.48);
  color: var(--muted);
  text-align: center;
  padding: 28px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(42,58,43,.28);
  backdrop-filter: blur(18px);
}
.modal-backdrop.show { display: flex; }
.modal {
  width: min(980px, 100%);
  max-height: 92vh;
  overflow: auto;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.78);
  background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(246,250,244,.88));
  box-shadow: 0 34px 90px -46px rgba(29,44,34,.8);
}
.modal.small { width: min(640px, 100%); }
.modal-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(20px);
}
.modal-title { font-size: 20px; font-weight: 700; }
.modal-body { padding: 20px; }
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 15px 20px;
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.62);
}
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,.72);
  color: var(--ink);
}
.detail-top {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  gap: 15px;
  align-items: center;
  margin-bottom: 18px;
}
.detail-logo { width: 72px; height: 72px; border-radius: 18px; }
.detail-title { font-size: 24px; font-weight: 700; }
.detail-sub { margin-top: 5px; color: var(--muted); font-size: 13px; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.calendar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 16px 0 10px;
}
.month-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  letter-spacing: .1em;
  color: var(--muted);
  text-transform: uppercase;
  text-align: center;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.day-name {
  padding: 8px 4px;
  text-align: center;
  color: var(--muted);
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: .08em;
}
.day {
  min-height: 82px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 7px;
  background: rgba(255,255,255,.58);
  overflow: hidden;
}
.day.other { opacity: .35; }
.day.busy {
  background: rgba(120,148,111,.13);
  border-color: rgba(82,111,77,.27);
}
.day-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 800;
}
.day-customer {
  margin-top: 7px;
  color: #435f43;
  font-weight: 800;
  line-height: 1.08;
}
.day-customer span {
  display: block;
  white-space: nowrap;
}
.day-free {
  margin-top: 7px;
  color: #78946f;
  font-size: 10px;
  font-weight: 700;
}
.res-list {
  margin-top: 18px;
  border-top: 1px solid var(--line);
}
.res-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.res-main { font-weight: 700; }
.res-meta { margin-top: 4px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.res-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.field { display: grid; gap: 6px; }
.field.full { grid-column: 1/-1; }
label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
input, select, textarea {
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 12px;
  background: rgba(255,255,255,.76);
  color: var(--ink);
}
textarea { min-height: 78px; resize: vertical; }
.calc-box {
  grid-column: 1/-1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.calc-card {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,.56);
}
.calc-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
}
.calc-value { margin-top: 5px; font-weight: 800; }
@media (max-width: 700px) {
  body { padding: 14px; }
  .topbar { align-items: stretch; flex-direction: column; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; }
  .btn { width: 100%; padding: 0 10px; }
  .car-grid { grid-template-columns: 1fr; }
  .modal-backdrop { padding: 0; align-items: stretch; }
  .modal { max-height: 100dvh; border-radius: 0; }
  .modal-body { padding: 14px; }
  .detail-top { grid-template-columns: 58px 1fr; }
  .detail-logo { width: 58px; height: 58px; }
  .detail-actions { grid-column: 1/-1; justify-content: flex-start; }
  .month-grid { gap: 4px; }
  .day { min-height: 62px; padding: 5px; border-radius: 9px; }
  .form-grid, .calc-box { grid-template-columns: 1fr; }
  .res-row { grid-template-columns: 1fr; }
  .res-actions { justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Ö</div>
      <div>
        <div class="brand-name">Ölmez Araç Kiralama</div>
        <div class="brand-sub">Filo ve Rezervasyon</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="openReservationModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Yeni Rezervasyon
      </button>
      <button class="btn primary" onclick="openVehicleModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Araç Ekle
      </button>
    </div>
  </header>

  <main class="car-grid" id="carGrid"></main>
</div>

<div class="modal-backdrop" id="vehicleDetailModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="detailModalTitle">Araç</div>
      <button class="icon-btn" onclick="closeModal('vehicleDetailModal')">×</button>
    </div>
    <div class="modal-body" id="vehicleDetailBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="vehicleModal">
  <div class="modal small">
    <div class="modal-head">
      <div class="modal-title" id="vehicleModalTitle">Araç Ekle</div>
      <button class="icon-btn" onclick="closeModal('vehicleModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Marka</label><input id="vBrand" autocomplete="off"></div>
        <div class="field"><label>Model</label><input id="vModel" autocomplete="off"></div>
        <div class="field"><label>Plaka</label><input id="vPlate" autocomplete="off"></div>
        <div class="field"><label>Yıl</label><input id="vYear" type="number"></div>
        <div class="field"><label>Renk</label><input id="vColor" autocomplete="off"></div>
        <div class="field"><label>Yakıt</label><input id="vFuel" autocomplete="off"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('vehicleModal')">İptal</button>
      <button class="btn primary" onclick="saveVehicle()">Kaydet</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="reservationModal">
  <div class="modal small">
    <div class="modal-head">
      <div class="modal-title" id="reservationModalTitle">Yeni Rezervasyon</div>
      <button class="icon-btn" onclick="closeModal('reservationModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label>Araç</label><select id="rVehicle"></select></div>
        <div class="field"><label>Müşteri</label><input id="rCustomer" autocomplete="off"></div>
        <div class="field"><label>Telefon</label><input id="rPhone" autocomplete="off"></div>
        <div class="field"><label>Başlangıç</label><input id="rStart" type="date" onchange="updateReservationCalc()"></div>
        <div class="field"><label>Bitiş</label><input id="rEnd" type="date" onchange="updateReservationCalc()"></div>
        <div class="field"><label>Veriliş Saati</label><input id="rTimeStart" type="time"></div>
        <div class="field"><label>Dönüş Saati</label><input id="rTimeEnd" type="time"></div>
        <div class="field"><label>Araç Günlük</label><input id="rVehicleDaily" type="number" oninput="updateReservationCalc()"></div>
        <div class="field"><label>Müşteri Günlük</label><input id="rCustomerDaily" type="number" oninput="updateReservationCalc()"></div>
        <div class="field"><label>Para Birimi</label><select id="rCurrency" onchange="updateReservationCalc()"><option value="TL">₺ TL</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option></select></div>
        <div class="field"><label>İş Kimden Geldi?</label><input id="rReferral" autocomplete="off"></div>
        <div class="calc-box" id="reservationCalc"></div>
        <div class="field full"><label>Not</label><textarea id="rNotes"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('reservationModal')">İptal</button>
      <button class="btn primary" onclick="saveReservation()">Kaydet</button>
    </div>
  </div>
</div>

<script>
const BOOTSTRAP_DATA = {
  exportedAt: "2026-05-11T13:51:59.251Z",
  vehicles: [
    {"brand":"Toyota","model":"Procity","year":"2021","plate":"16LMZ77","fuel":"Dizel","transmission":"Otomatik","km":"","color":"Beyaz","status":"available","customer":"","phone":"","rentStart":"","rentEnd":"","dailyRate":"","currency":"","depositTaken":"no","depositAmount":"","depositCurrency":"","deliveryLocation":"","returnLocation":"","deliveryFeeTaken":"no","deliveryFee":"","deliveryFeeCurrency":"","inspectionDate":"","nextInspection":"","insuranceEnd":"","kaskoEnd":"","lastService":"","nextServiceKm":"","notes":"","vehicleDailyRate":"","referralSource":"","commissionTo":"","commissionAmount":0,"commissionCurrency":"TL","id":1778505149839},
    {"brand":"Fiat","model":"Egea","year":"2021","plate":"34 GEV 368","fuel":"Benzin","transmission":"Otomatik","km":"","color":"Beyaz","status":"available","customer":"","phone":"","rentStart":"","rentEnd":"","dailyRate":"","currency":"","depositTaken":"no","depositAmount":"","depositCurrency":"","deliveryLocation":"","returnLocation":"","deliveryFeeTaken":"no","deliveryFee":"","deliveryFeeCurrency":"","inspectionDate":"","nextInspection":"","insuranceEnd":"","kaskoEnd":"","lastService":"","nextServiceKm":"","notes":"","vehicleDailyRate":"","referralSource":"","commissionTo":"","commissionAmount":0,"commissionCurrency":"TL","id":1778505195329}
  ],
  reservations: [
    {"vehicleId":1778505149839,"customer":"Saeed Hassan","phone":"","email":"","start":"2026-05-18","end":"2026-06-08","timeStart":"23:30","timeEnd":"14:30","vehicleDailyRate":"1750","dailyRate":"1900","currency":"TL","referralSource":"Eren Çalışkan","commissionTo":"","commissionAmount":"3150","commissionCurrency":"TL","depositTaken":"no","depositAmount":"","depositCurrency":"TL","deliveryLocation":"Sabiha Gökçen Havalimanı","returnLocation":"İstanbul Havalimanı","deliveryFeeTaken":"no","deliveryFee":"8000","deliveryFeeCurrency":"TL","notes":"","status":"confirmed","id":1778505294347},
    {"vehicleId":1778505195329,"customer":"Fevzi Bey","phone":"","email":"","start":"2026-05-14","end":"2026-05-20","timeStart":"14:30","timeEnd":"14:30","vehicleDailyRate":"1400","dailyRate":"1500","currency":"TL","referralSource":"Kadir Ölmez","commissionTo":"","commissionAmount":"600","commissionCurrency":"TL","depositTaken":"no","depositAmount":"","depositCurrency":"TL","deliveryLocation":"","returnLocation":"","deliveryFeeTaken":"no","deliveryFee":"","deliveryFeeCurrency":"TL","notes":"","status":"confirmed","id":1778505349222},
    {"vehicleId":1778505195329,"customer":"Fatma Alyaqut","phone":"","email":"","start":"2026-05-20","end":"2026-05-31","timeStart":"15:15","timeEnd":"15:15","vehicleDailyRate":"1300","dailyRate":"1500","currency":"TL","referralSource":"Kadir Ölmez","commissionTo":"","commissionAmount":"2200","commissionCurrency":"TL","depositTaken":"no","depositAmount":"","depositCurrency":"TL","deliveryLocation":"","returnLocation":"","deliveryFeeTaken":"no","deliveryFee":"","deliveryFeeCurrency":"TL","notes":"","status":"confirmed","id":1778505408406}
  ]
};

const VEHICLE_KEY = "fleet_vehicles_v2";
const RES_KEY = "fleet_reservations_v2";
const IMPORT_KEY = "fleet_simple_imported_backup_at";
const BACKUP_KEY = "fleet_simple_backups_v1";
let vehicles = [];
let reservations = [];
let selectedVehicleId = null;
let editVehicleId = null;
let editReservationId = null;
let detailMonth = new Date();

const LOGOS = {
  Toyota: `<svg viewBox="0 0 100 100"><g fill="none" stroke="#d71920" stroke-width="4"><ellipse cx="50" cy="50" rx="43" ry="30"/><ellipse cx="50" cy="50" rx="13" ry="30"/><ellipse cx="50" cy="39" rx="21" ry="10"/></g></svg>`,
  Fiat: `<svg viewBox="0 0 100 100"><rect x="9" y="26" width="82" height="48" rx="10" fill="#9e1b25"/><text x="50" y="58" font-family="Georgia" font-size="24" font-weight="900" text-anchor="middle" fill="#f3d7a0">FIAT</text></svg>`,
  BMW: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#111"/><circle cx="50" cy="50" r="36" fill="#fff"/><path d="M50 14a36 36 0 0 1 36 36H50z" fill="#2f6fbe"/><path d="M50 86A36 36 0 0 1 14 50h36z" fill="#2f6fbe"/></svg>`,
  Mercedes: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="none" stroke="#555" stroke-width="4"/><path d="M50 50V14M50 50l31 18M50 50 19 68" stroke="#555" stroke-width="5" stroke-linecap="round"/></svg>`
};

function logo(brand) {
  return LOGOS[brand] || `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="#eef4ea" stroke="#78946f" stroke-width="3"/><text x="50" y="61" text-anchor="middle" font-family="Inter" font-size="31" font-weight="800" fill="#526f4d">${esc((brand || "?").slice(0,1).toUpperCase())}</text></svg>`;
}
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function readJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; }
  catch { return fallback; }
}
function backup(reason) {
  const list = readJson(BACKUP_KEY, []);
  list.unshift({ id: Date.now(), reason, createdAt: new Date().toISOString(), vehicles, reservations });
  localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(0, 20)));
}
function installBackupOnce() {
  if (localStorage.getItem(IMPORT_KEY) === BOOTSTRAP_DATA.exportedAt) return;
  const oldVehicles = readJson(VEHICLE_KEY, null);
  const oldReservations = readJson(RES_KEY, null);
  if (oldVehicles || oldReservations) {
    localStorage.setItem(`${BACKUP_KEY}_before_import_${Date.now()}`, JSON.stringify({ oldVehicles, oldReservations }));
  }
  localStorage.setItem(VEHICLE_KEY, JSON.stringify(BOOTSTRAP_DATA.vehicles));
  localStorage.setItem(RES_KEY, JSON.stringify(BOOTSTRAP_DATA.reservations));
  localStorage.setItem(IMPORT_KEY, BOOTSTRAP_DATA.exportedAt);
}
function load() {
  installBackupOnce();
  vehicles = readJson(VEHICLE_KEY, BOOTSTRAP_DATA.vehicles);
  reservations = readJson(RES_KEY, BOOTSTRAP_DATA.reservations);
}
function save() {
  backup("Otomatik kayıt yedeği");
  localStorage.setItem(VEHICLE_KEY, JSON.stringify(vehicles));
  localStorage.setItem(RES_KEY, JSON.stringify(reservations));
}
function dateStr(date) {
  if (!date) return "—";
  return new Date(date).toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" });
}
function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function daysBetween(start, end) {
  if (!start || !end) return 0;
  return Math.max(1, Math.round((new Date(end) - new Date(start)) / 86400000));
}
function activeReservationsFor(vehicleId) {
  return reservations
    .filter(r => r.vehicleId === vehicleId && r.status !== "cancelled")
    .sort((a,b) => new Date(a.start) - new Date(b.start));
}
function nextReservation(vehicleId) {
  const today = iso(new Date());
  return activeReservationsFor(vehicleId).find(r => r.end >= today) || activeReservationsFor(vehicleId)[0] || null;
}
function reservationTotal(r) {
  const days = daysBetween(r.start, r.end);
  const customerDaily = Number(r.dailyRate || 0);
  const vehicleDaily = Number(r.vehicleDailyRate || customerDaily || 0);
  const gross = days * customerDaily;
  const net = days * vehicleDaily;
  return { days, gross, net, commission: Math.max(gross - net, 0), curr: r.currency || "TL" };
}
function money(amount, curr = "TL") {
  const symbol = { TL:"₺", USD:"$", EUR:"€" }[curr] || "";
  return `${symbol}${Number(amount || 0).toLocaleString("tr-TR")}`;
}

function renderCards() {
  const grid = document.getElementById("carGrid");
  if (vehicles.length === 0) {
    grid.innerHTML = `<div class="empty"><div><strong>Araç yok</strong><br>Üstteki Araç Ekle butonuyla başlayın.</div></div>`;
    return;
  }
  grid.innerHTML = vehicles.map(v => {
    const next = nextReservation(v.id);
    return `
      <button class="car-card" onclick="openVehicleDetail(${v.id})">
        <div class="car-head">
          <div class="logo">${logo(v.brand)}</div>
          <div>
            <div class="car-title">${esc(v.brand)} ${esc(v.model || "")}</div>
            <div class="plate">${esc(v.plate || "PLAKA")}</div>
          </div>
        </div>
        <div class="next-res">
          <div class="next-label">Yaklaşan Rezervasyon</div>
          ${next ? `
            <div class="next-name">${esc(next.customer || "Müşteri")}</div>
            <div class="next-date">${dateStr(next.start)} ${next.timeStart || ""} - ${dateStr(next.end)} ${next.timeEnd || ""}</div>
          ` : `
            <div class="next-name">Boş</div>
            <div class="next-date">Yaklaşan rezervasyon yok.</div>
          `}
        </div>
      </button>
    `;
  }).join("");
}

function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }
document.querySelectorAll(".modal-backdrop").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));

function nameSize(text) {
  const len = String(text || "").length;
  if (len <= 6) return 10.5;
  if (len <= 8) return 9;
  if (len <= 10) return 8;
  if (len <= 12) return 7.2;
  return 6.3;
}
function customerLines(name) {
  const parts = String(name || "Dolu").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 1) return `<span style="font-size:${nameSize(parts[0])}px">${esc(parts[0])}</span>`;
  const surname = parts.pop();
  const first = parts.join(" ");
  return `<span style="font-size:${nameSize(first)}px">${esc(first)}</span><span style="font-size:${nameSize(surname)}px">${esc(surname)}</span>`;
}
function reservationOnDay(items, day) {
  return items.find(r => r.start <= day && r.end >= day);
}
function setDetailMonth(delta) {
  detailMonth.setMonth(detailMonth.getMonth() + delta);
  renderVehicleDetail();
}
function openVehicleDetail(id) {
  selectedVehicleId = id;
  const first = nextReservation(id);
  detailMonth = first ? new Date(`${first.start}T12:00:00`) : new Date();
  renderVehicleDetail();
  openModal("vehicleDetailModal");
}
function renderVehicleDetail() {
  const v = vehicles.find(x => x.id === selectedVehicleId);
  if (!v) return;
  const items = activeReservationsFor(v.id);
  const y = detailMonth.getFullYear();
  const m = detailMonth.getMonth();
  const monthNames = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);
  let startWeekday = first.getDay();
  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1;
  let cells = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(d => `<div class="day-name">${d}</div>`).join("");
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startWeekday - 1; i >= 0; i--) cells += `<div class="day other"><div class="day-num">${prevLast - i}</div></div>`;
  for (let d = 1; d <= last.getDate(); d++) {
    const day = iso(new Date(y, m, d));
    const r = reservationOnDay(items, day);
    cells += `
      <div class="day ${r ? "busy" : ""}">
        <div class="day-num">${d}</div>
        ${r ? `<div class="day-customer">${customerLines(r.customer)}</div>` : `<div class="day-free">Boş</div>`}
      </div>
    `;
  }
  const used = startWeekday + last.getDate();
  const remain = (7 - (used % 7)) % 7;
  for (let i = 1; i <= remain; i++) cells += `<div class="day other"><div class="day-num">${i}</div></div>`;

  document.getElementById("detailModalTitle").textContent = `${v.brand} ${v.model}`;
  document.getElementById("vehicleDetailBody").innerHTML = `
    <div class="detail-top">
      <div class="logo detail-logo">${logo(v.brand)}</div>
      <div>
        <div class="detail-title">${esc(v.brand)} ${esc(v.model || "")}</div>
        <div class="detail-sub">${esc(v.plate || "")}${v.year ? " · " + esc(v.year) : ""}${v.color ? " · " + esc(v.color) : ""}</div>
      </div>
      <div class="detail-actions">
        <button class="btn" onclick="openReservationModal(${v.id})">Rezervasyon Ekle</button>
        <button class="btn" onclick="openVehicleModal(${v.id})">Düzenle</button>
      </div>
    </div>
    <div class="calendar-head">
      <button class="btn" onclick="setDetailMonth(-1)">‹</button>
      <div class="month-title">${monthNames[m]} ${y}</div>
      <button class="btn" onclick="setDetailMonth(1)">›</button>
    </div>
    <div class="month-grid">${cells}</div>
    <div class="res-list">
      ${items.map(r => {
        const total = reservationTotal(r);
        return `
          <div class="res-row">
            <div>
              <div class="res-main">${esc(r.customer || "Müşteri")}</div>
              <div class="res-meta">${dateStr(r.start)} ${r.timeStart || ""} - ${dateStr(r.end)} ${r.timeEnd || ""} · ${total.days} gün<br>Araca kalan ${money(total.net, total.curr)} · Komisyon ${money(total.commission, total.curr)}</div>
            </div>
            <div class="res-actions">
              <button class="btn" onclick="openReservationModal(${v.id}, ${r.id})">Düzenle</button>
              <button class="btn danger" onclick="deleteReservation(${r.id})">Sil</button>
            </div>
          </div>
        `;
      }).join("") || `<div class="res-row"><div class="res-meta">Bu araçta rezervasyon yok.</div></div>`}
    </div>
  `;
}

function openVehicleModal(id = null) {
  editVehicleId = id;
  const v = vehicles.find(x => x.id === id) || {};
  document.getElementById("vehicleModalTitle").textContent = id ? "Araç Düzenle" : "Araç Ekle";
  document.getElementById("vBrand").value = v.brand || "";
  document.getElementById("vModel").value = v.model || "";
  document.getElementById("vPlate").value = v.plate || "";
  document.getElementById("vYear").value = v.year || "";
  document.getElementById("vColor").value = v.color || "";
  document.getElementById("vFuel").value = v.fuel || "";
  openModal("vehicleModal");
}
function saveVehicle() {
  const brand = document.getElementById("vBrand").value.trim();
  const plate = document.getElementById("vPlate").value.trim().toUpperCase();
  if (!brand || !plate) return alert("Marka ve plaka zorunludur.");
  const data = {
    brand,
    model: document.getElementById("vModel").value.trim(),
    plate,
    year: document.getElementById("vYear").value,
    color: document.getElementById("vColor").value.trim(),
    fuel: document.getElementById("vFuel").value.trim(),
    status: "available"
  };
  if (editVehicleId) {
    vehicles = vehicles.map(v => v.id === editVehicleId ? { ...v, ...data } : v);
  } else {
    vehicles.push({ ...data, id: Date.now() });
  }
  save();
  renderCards();
  if (selectedVehicleId) renderVehicleDetail();
  closeModal("vehicleModal");
}

function openReservationModal(vehicleId = null, reservationId = null) {
  editReservationId = reservationId;
  document.getElementById("reservationModalTitle").textContent = reservationId ? "Rezervasyon Düzenle" : "Yeni Rezervasyon";
  document.getElementById("rVehicle").innerHTML = vehicles.map(v => `<option value="${v.id}">${esc(v.brand)} ${esc(v.model || "")} · ${esc(v.plate)}</option>`).join("");
  const r = reservations.find(x => x.id === reservationId) || {};
  document.getElementById("rVehicle").value = r.vehicleId || vehicleId || vehicles[0]?.id || "";
  document.getElementById("rCustomer").value = r.customer || "";
  document.getElementById("rPhone").value = r.phone || "";
  document.getElementById("rStart").value = r.start || "";
  document.getElementById("rEnd").value = r.end || "";
  document.getElementById("rTimeStart").value = r.timeStart || "";
  document.getElementById("rTimeEnd").value = r.timeEnd || "";
  document.getElementById("rVehicleDaily").value = r.vehicleDailyRate || "";
  document.getElementById("rCustomerDaily").value = r.dailyRate || "";
  document.getElementById("rCurrency").value = r.currency || "TL";
  document.getElementById("rReferral").value = r.referralSource || "";
  document.getElementById("rNotes").value = r.notes || "";
  updateReservationCalc();
  openModal("reservationModal");
}
function getDraftReservation() {
  return {
    start: document.getElementById("rStart").value,
    end: document.getElementById("rEnd").value,
    vehicleDailyRate: document.getElementById("rVehicleDaily").value,
    dailyRate: document.getElementById("rCustomerDaily").value,
    currency: document.getElementById("rCurrency").value
  };
}
function updateReservationCalc() {
  const total = reservationTotal(getDraftReservation());
  document.getElementById("reservationCalc").innerHTML = `
    <div class="calc-card"><div class="calc-label">Gün</div><div class="calc-value">${total.days || "—"}</div></div>
    <div class="calc-card"><div class="calc-label">Araca Kalan</div><div class="calc-value">${total.net ? money(total.net, total.curr) : "—"}</div></div>
    <div class="calc-card"><div class="calc-label">Komisyon</div><div class="calc-value">${total.commission ? money(total.commission, total.curr) : "—"}</div></div>
  `;
}
function saveReservation() {
  const vehicleId = Number(document.getElementById("rVehicle").value);
  const customer = document.getElementById("rCustomer").value.trim();
  const start = document.getElementById("rStart").value;
  const end = document.getElementById("rEnd").value;
  if (!vehicleId || !customer || !start || !end) return alert("Araç, müşteri ve tarih zorunludur.");
  const total = reservationTotal(getDraftReservation());
  const data = {
    vehicleId,
    customer,
    phone: document.getElementById("rPhone").value.trim(),
    start,
    end,
    timeStart: document.getElementById("rTimeStart").value,
    timeEnd: document.getElementById("rTimeEnd").value,
    vehicleDailyRate: document.getElementById("rVehicleDaily").value,
    dailyRate: document.getElementById("rCustomerDaily").value,
    currency: document.getElementById("rCurrency").value,
    referralSource: document.getElementById("rReferral").value.trim(),
    commissionAmount: total.commission,
    commissionCurrency: total.curr,
    notes: document.getElementById("rNotes").value.trim(),
    status: "confirmed"
  };
  if (editReservationId) {
    reservations = reservations.map(r => r.id === editReservationId ? { ...r, ...data } : r);
  } else {
    reservations.push({ ...data, id: Date.now() });
  }
  selectedVehicleId = vehicleId;
  save();
  renderCards();
  if (document.getElementById("vehicleDetailModal").classList.contains("show")) renderVehicleDetail();
  closeModal("reservationModal");
}
function deleteReservation(id) {
  if (!confirm("Rezervasyon silinsin mi?")) return;
  reservations = reservations.filter(r => r.id !== id);
  save();
  renderCards();
  renderVehicleDetail();
}

load();
renderCards();
</script>
</body>
</html>
